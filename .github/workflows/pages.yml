name: Deploy app to GitHub Pages

# Publishes the site (an installable web app) at https://<owner>.github.io/<repo>/.
# One-time setup: Settings → Pages → Build and deployment → Source: "GitHub Actions".
# Commits made by the scheduled data refresh use GITHUB_TOKEN, which does not trigger `push`
# workflows, so this also runs after every successful "Refresh data" run.
on:
  push:
    branches: [main]
  workflow_run:
    workflows: ["Refresh data"]
    types: [completed]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  deploy:
    if: github.event_name != 'workflow_run' || github.event.workflow_run.conclusion == 'success'
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
      - name: Collect site files
        run: |
          mkdir -p _site
          cp -r index.html manifest.webmanifest sw.js css js lib data icons _site/
          touch _site/.nojekyll
      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v3
        with:
          path: _site
      - id: deployment
        uses: actions/deploy-pages@v4
